name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv run --extra dev ruff check src tools tests
      - run: uv run --extra dev ruff format --check src tools tests
      - run: uv run --extra dev pytest -q
